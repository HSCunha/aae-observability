name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m pip_audit --skip-editable .

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "validate-pyproject>=0.20,<1"
      - run: validate-pyproject pyproject.toml

  package:
    runs-on: ubuntu-latest
    needs: [quality, metadata]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel in a clean environment
        run: |
          python -m venv /tmp/aae_observability-smoke
          /tmp/aae_observability-smoke/bin/python -m pip install dist/*.whl
          /tmp/aae_observability-smoke/bin/python -c "import aae_observability; assert aae_observability.__version__ == '0.6.3'"
          /tmp/aae_observability-smoke/bin/aae-observability version
